<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'eli - CAJA</title>
    <link rel="icon" type="image/png" href="img/deli.png">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <div class="admin-container">
        <header class="admin-header">
            <img src="img/deli.png" class="logo-small">
            <h1>Panel de Caja</h1>
        </header>

        <!-- Navegación rápida, generada desde menu.json -->
        <nav class="admin-nav" id="navMenu"></nav>

        <!-- Todo el catálogo se genera desde menu.json -->
        <div class="content" id="menu"></div>
    </div>

    <!-- Modal único: el motor de pasos pinta aquí adentro -->
    <div id="modal-flujo" class="modal">
        <div class="modal-contenido"></div>
    </div>

    <!-- PANEL CARRITO -->
    <div class="carrito-panel">
        <div class="carrito-header">
            <h3>Orden Actual</h3>
            <button id="btn-limpiar" class="btn-small">Limpiar</button>
        </div>
        <div id="lista-carrito" class="carrito-lista"></div>
        <div class="carrito-footer">
            <h3 id="total-carrito">Total: $0</h3>
            <div class="envio-botones" id="envio-botones"></div>
        </div>
        <!-- PAGO Y CAMBIO -->
        <div class="carrito-pago" style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
                <label style="color:white;">Recibo:</label>
                <input type="number" id="input-recibo" placeholder="$"
                    style="width: 80px; padding: 5px; border-radius: 5px; border: none;">
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="margin:0; color: var(--colorPrimario);">Cambio:</h3>
                <h3 id="output-cambio" style="margin:0;">$0</h3>
            </div>
        </div>
    </div>

    <script type="module" src="js/caja.js"></script>
</body>

</html>
