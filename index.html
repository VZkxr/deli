<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'eli</title>
    <link rel="icon" type="image/png" href="img/deli.png">
    <link rel="stylesheet" href="estilos.css">
</head>

        <header id="inicio" class="text-center">
            <a href="index.html">
                <img src="img/deli.png" class="logo">
            </a>

                    📍 Av del Castillo, El Arbolillo, 07240 CDMX, Cuautepec de Madero.
                </a>
            </p>

            <a href="https://www.instagram.com/deli_postres_yummi?igsh=MXUwam9mZWNjMTluMw==" target="_blank" class="btn-instagram-animado">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.051.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="18" height="18">

            <p class="text-center">
                <a target="_blank" style="color: var(--colorPrimario); font-weight: bold; font-size: 0.8rem;">
                    Algunas imágenes son ilustrativas
                </a>
            </p>

            <!-- Todo el menú se genera desde menu.json -->
            <div id="menu"></div>
        </div>
        <!-- //CONTENT-->
        <footer class="text-center">
            <p>Copyright &copy; 2026 D'eli. Todos los derechos reservados.</p>
        </footer>
    </div>

    <!-- Modal único: el motor de pasos pinta aquí adentro -->
    <div id="modal-flujo" class="modal">
        <div class="modal-contenido"></div>
    </div>

.9355625 10.347156 9.7890625 10.285156 9.6640625 C 10.223156 9.5390625 9.737625 8.3065 9.515625 7.8125 C 9.328625 7.3975 9.131125 7.3878594 8.953125 7.3808594 C 8.808125 7.3748594 8.6425625 7.375 8.4765625 7.375 z">
            </path>
        </svg>
        Enviar pedido
    </button>

    <!-- Botón flotante para ver carrito -->
    <button id="btn-carrito" class="btn-carrito" disabled>
        <img src="img/cart.svg" width="16" height="16"
            style="vertical-align: middle; margin-right: 6px; filter: invert(1);" alt="Carrito">
        <span id="btn-carrito-text">Ver carrito (0)</span>
    </button>

    <!-- Modal Carrito -->
    <div id="modal-carrito" class="modal">
        <div class="modal-contenido">
            <span id="cerrarCarrito" class="cerrar">&times;</span>
            <h2>Tu carrito</h2>
            <div id="lista-carrito"></div>
            <p id="total-carrito"></p>
        </div>
    </div>

    <script type="module" src="js/menu.js"></script>
</body>

</html>
